  <!-- CONTEXT MEMORY
  Updated: 2026-04-12
  Author: Codex
  Reason: The shell metadata now serves both standard PWA install fields and
          Farcaster Mini App embed metadata from the same document.
  Goal: Keep browser install metadata and Farcaster share metadata aligned
        without introducing route-specific runtime injection.
  Owns: Web app shell metadata, share-card hints, Farcaster embed tags, and the
        canonical public icon filename.
  Does Not Own: Runtime rendering, auth, token loading, or manifest signing.
  Design Language:
  - Prefer standards-based PWA flags over deprecated vendor-only variants.
  - Keep Farcaster embed metadata static in the HTML shell unless a route
    explicitly needs its own embed card.
  - Keep install metadata minimal and explicit.
  - Use /icon.png as the single public favicon / touch icon source.
  - Use /farcaster-splash.png as the canonical loading splash mark, and keep /icon.png for favicon and touch-icon roles.
  - Keep the public app name synchronized across shell, manifest, and Farcaster
    metadata.
  See also:
  - /Users/almurat/KiKo/system-journal/INDEX.md
  - /Users/almurat/KiKo/system-journal/fix-log/2026-04-08-rate-limit-loading-stall.md

  - /Users/almurat/KiKo/system-journal/owner-map/farcaster-miniapp-support.md
  - /Users/almurat/KiKo/system-journal/fix-log/2026-04-10-farcaster-miniapp-support.md
  -->

  <!-- Nunito Font for KIKO Logo (Rounded Bold) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@900&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    // iOS Safari Debug Helper
    (function() {
      const isIOSSafari = /iPhone|iPad|iPod/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
      
      if (isIOSSafari) {
        const errorDiv = document.getElementById('safari-error');
        const errorContent = document.getElementById('safari-error-content');
        let hasError = false;

        window.addEventListener('error', function(e) {
          hasError = true;
          if (errorDiv && errorContent) {
            errorDiv.style.display = 'block';
            errorContent.innerHTML += `<p><strong>Error:</strong> ${e.message}<br>File: ${e.filename}<br>Line: ${e.lineno}:${e.colno}</p>`;
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          hasError = true;
          if (errorDiv && errorContent) {
            errorDiv.style.display = 'block';
            errorContent.innerHTML += `<p><strong>Unhandled Promise Rejection:</strong> ${e.reason}</p>`;
          }
        });

        // Check if app loaded after 3 seconds
        setTimeout(function() {
          const root = document.getElementById('root');
          if (root && root.children.length === 0 && !hasError) {
            if (errorDiv && errorContent) {
              errorDiv.style.display = 'block';
              errorContent.innerHTML = '<p><strong>App failed to load</strong><br>The app loaded but did not render. This might be a React initialization issue.<br><br>User Agent: ' + navigator.userAgent + '</p>';
            }
          }
        }, 3000);
      }
    })();

    // Apply theme immediately to prevent flash
    (function () {
      try {
        const savedTheme = localStorage.getItem('kiko-theme');
        let theme = savedTheme;

        if (!theme || theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.documentElement.classList.add(theme);
      } catch (e) {
        // Default to dark if theme detection fails (to match dark design)
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <!-- iOS Safari Error Display Fallback -->
  <div id="safari-error" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; color: #fff; padding: 20px; font-family: monospace; font-size: 12px; overflow: auto; z-index: 99999;">
    <h2>iOS Safari Debug Info</h2>
    <div id="safari-error-content"></div>
  </div>

  <!-- SVG Filters for Liquid Glass Edge Refraction - Simplified for iOS Safari Compatibility -->
  <svg width="0" height="0" style="position: absolute; visibility: hidden;">
    <defs>
      <!-- Simplified filter for iOS Safari - removed complex feImage -->
      <filter id="liquid-glass-edge" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
        <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
        <feMerge>
          <feMergeNode in="offsetBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Simplified chromatic aberration for iOS Safari -->
      <filter id="chromatic-edge" x="-5%" y="-5%" width="110%" height="110%">
        <feOffset in="SourceGraphic" dx="-0.5" dy="0" result="red-shift"/>
        <feOffset in="SourceGraphic" dx="0.5" dy="0" result="blue-shift"/>
        <feBlend in="red-shift" in2="SourceGraphic" mode="screen" result="rg"/>
        <feBlend in="rg" in2="blue-shift" mode="screen"/>
      </filter>
    </defs>
  </svg>
  
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
