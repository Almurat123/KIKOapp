<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Antigravity-like Particles</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    #wrap {
      position: relative;
      height: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
    }

    .hero {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: #111;
      text-align: center;
      padding: 8vh 6vw;
    }

    .logo {
      font-size: 18px;
      opacity: .7;
      margin-bottom: 22px;
    }

    .title {
      font-size: clamp(44px, 6vw, 92px);
      font-weight: 700;
      line-height: 1.05;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="c"></canvas>

    <!-- 模拟你截图里的文字区域 -->
    <div class="hero">
      <div>
        <div class="logo">Google Antigravity</div>
        <div class="title">Experience liftoff with the<br />next-generation IDE</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: true });

      // ===== PHYSICS CONFIGURATION (Exact Match Attempt) =====
      const N = 850;
      // Interaction: Large radius, strong push, feeling "thick" (viscous)
      const MOUSE_RADIUS = 280;
      const MOUSE_PUSH = 3.5;
      const FRICTION = 0.93;         // Sticky flow
      const RETURN_SPEED = 0.006;    // Very slow, drift-like return to orbit
      const ORBIT_SPEED = 0.0008;    // Steady rotation

      // Colors: Spatial Gradient
      const colors = {
        tl: [140, 82, 255],  // Purple
        tr: [255, 92, 92],   // Red/Pink
        bl: [64, 120, 255],  // Blue
        br: [255, 200, 64]   // Yellow
      };

      let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

      function resize() {
        W = Math.floor(window.innerWidth);
        H = Math.floor(window.innerHeight);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.scale(DPR, DPR);
      }
      window.addEventListener("resize", resize);
      resize();

      const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999, inside: false };
      window.addEventListener("pointermove", (e) => {
        mouse.tx = e.clientX;
        mouse.ty = e.clientY;
        mouse.inside = true;
      });
      window.addEventListener("pointerleave", () => {
        mouse.inside = false;
        mouse.tx = -9999;
        mouse.ty = -9999;
      });

      function lerp(start, end, t) {
        return start * (1 - t) + end * t;
      }

      function getSpatialColor(x, y) {
        const u = x / W;
        const v = y / H;
        const rTop = lerp(colors.tl[0], colors.tr[0], u);
        const gTop = lerp(colors.tl[1], colors.tr[1], u);
        const bTop = lerp(colors.tl[2], colors.tr[2], u);
        const rBtm = lerp(colors.bl[0], colors.br[0], u);
        const gBtm = lerp(colors.bl[1], colors.br[1], u);
        const bBtm = lerp(colors.bl[2], colors.br[2], u);
        // Vertical blend
        const r = lerp(rTop, rBtm, v);
        const g = lerp(gTop, gBtm, v);
        const b = lerp(bTop, bBtm, v);
        return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
      }

      const particles = [];

      function initParticles() {
        particles.length = 0;

        // Distribution: Polar / Disk
        // Cover screen generously
        const maxR = Math.hypot(W, H) * 0.55;

        for (let i = 0; i < N; i++) {
          let r = Math.random() * maxR;
          // Slight bias to create "clouds" rather than perfect uniform noise?
          // Uniform r^2 is area-uniform. Simple linear random is denser at center.
          // Let's use linear random for center-density to match the "hero" feel.

          const theta = Math.random() * Math.PI * 2;

          const x = W / 2 + Math.cos(theta) * r;
          const y = H / 2 + Math.sin(theta) * r;

          particles.push({
            // Orbit properties
            orbitR: r,
            orbitTheta: theta,

            x: x,
            y: y,
            vx: 0,
            vy: 0,

            // Appearance
            size: Math.random() * 2 + 1.5,
            width: Math.random() * 0.6 + 0.5,
            // Per-particle slight variance
            friction: FRICTION + (Math.random() - 0.5) * 0.02,

            // Orientation state
            angle: theta + Math.PI / 2, // Initial tangent
          });
        }
      }

      initParticles();

      let globalTheta = 0;

      function tick(time) {
        // Global Rotation (CCW)
        globalTheta -= ORBIT_SPEED;

        // Smooth mouse interop
        mouse.x += (mouse.tx - mouse.x) * 0.12;
        mouse.y += (mouse.ty - mouse.y) * 0.12;

        ctx.clearRect(0, 0, W, H);

        const centerX = W / 2;
        const centerY = H / 2;

        particles.forEach(p => {
          // --- 1. Target "Home" Orbit ---
          // Rotate target position
          const currentTheta = p.orbitTheta + globalTheta;
          const homeX = centerX + Math.cos(currentTheta) * p.orbitR;
          const homeY = centerY + Math.sin(currentTheta) * p.orbitR;

          // Viscous Spring
          const dxHome = homeX - p.x;
          const dyHome = homeY - p.y;

          p.vx += dxHome * RETURN_SPEED;
          p.vy += dyHome * RETURN_SPEED;

          // --- 2. Mouse Interaction (Void) ---
          if (mouse.inside) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < MOUSE_RADIUS * MOUSE_RADIUS) {
              const dist = Math.sqrt(distSq);
              // Smooth falloff curve
              const t = 1 - dist / MOUSE_RADIUS;
              // t^2 is good, t^3 is sharper "wall"
              const force = t * t * MOUSE_PUSH;

              const angle = Math.atan2(dy, dx);
              p.vx += Math.cos(angle) * force;
              p.vy += Math.sin(angle) * force;
            }
          }

          // --- 3. Physics Step ---
          p.vx *= p.friction;
          p.vy *= p.friction;
          p.x += p.vx;
          p.y += p.vy;

          // --- 4. Orientation (The Key) ---
          // Rule: Default to Tangent. If pushed, blend to Velocity or Repel angle.

          // A. Calculate Tangent of current position relative to Center
          // (This keeps them swirling correctly around the vortex center whatever happens)
          const dxC = p.x - centerX;
          const dyC = p.y - centerY;
          const angleToCenter = Math.atan2(dyC, dxC);
          const tangentAngle = angleToCenter + Math.PI / 2; // CCW Tangent

          // B. Get Speed
          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);

          let targetAngle = tangentAngle;

          // If moving significantly faster than idle orbit speed (~1.0),
          // it means we are being pushed or flying back.
          // In that case, align with Velocity (looks like "streaking").
          if (speed > 1.2) {
            targetAngle = Math.atan2(p.vy, p.vx);
          }

          // Smooth rotation prevents jitter
          let diff = targetAngle - p.angle;
          while (diff <= -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          p.angle += diff * 0.12;

          // --- 5. Render ---
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);

          ctx.fillStyle = getSpatialColor(p.x, p.y);

          // Stretch based on speed (blur effect)
          // Minimum length = p.size
          const l = p.size + Math.min(speed * 3.5, 25);
          const w = p.width;

          ctx.beginPath();
          ctx.roundRect(-l / 2, -w / 2, l, w, w / 2);
          ctx.fill();

          ctx.restore();
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>

</html>
