<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Antigravity-like Particles</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    #wrap {
      position: relative;
      height: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
    }

    .hero {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: #111;
      text-align: center;
      padding: 8vh 6vw;
    }

    .logo {
      font-size: 18px;
      opacity: .7;
      margin-bottom: 22px;
    }

    .title {
      font-size: clamp(44px, 6vw, 92px);
      font-weight: 700;
      line-height: 1.05;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="c"></canvas>

    <!-- 模拟你截图里的文字区域 -->
    <div class="hero">
      <div>
        <div class="logo">Google Antigravity</div>
        <div class="title">Experience liftoff with the<br />next-generation IDE</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: true });

      // ===== 你主要调这 4 个 =====
      const N = 650;                 // 粒子数量（截图那种密度：500~900）
      const RING_RADIUS = 420;       // 环半径（跟标题尺寸相关）
      const MOUSE_RADIUS = 160;      // 鼠标影响半径（120~220）
      const MOUSE_PUSH = 1.35;       // 鼠标外凸强度（1.0~2.2）

      // ===== 更细腻的“水母呼吸”感 =====
      const SPRING_K = 0.015;        // 回家弹簧（0.010~0.022）
      const DAMPING = 0.90;          // 阻尼（0.88~0.94）
      const ORBIT = 0.28;            // 围绕（切向）比例（0.10~0.35，太大就漩涡）
      const NOISE = 0.22;            // 噪声强度（0.10~0.35，太大就乱）
      const NOISE_SCALE = 0.010;     // 噪声空间频率（越小越柔）
      const BREATH = 0.18;           // 全局轻微呼吸（0.0~0.25）

      // 颜色：彩色但很克制（接近截图）
      const palette = [
        [255, 92, 92],   // red
        [255, 165, 64],  // orange
        [255, 200, 64],  // yellow
        [120, 160, 255], // blue
        [160, 120, 255], // purple
      ];

      let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
      function resize() {
        W = Math.floor(window.innerWidth);
        H = Math.floor(window.innerHeight);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      // 文案区域中心：你可以改成真实测量 DOM 的标题盒子中心
      function getHeroCenter() {
        // 大概让环围绕标题中心：偏上
        return { x: W * 0.5, y: H * 0.44 };
      }

      // 平滑鼠标（关键：同方向顺滑）
      const mouse = { x: W / 2, y: H / 2, tx: W / 2, ty: H / 2, inside: false, power: 0 };
      window.addEventListener("pointermove", (e) => {
        mouse.tx = e.clientX;
        mouse.ty = e.clientY;
        mouse.inside = true;
      });
      window.addEventListener("pointerleave", () => { mouse.inside = false; });

      // 简单 hash noise（够用，轻量）
      function hash(n) { return (Math.sin(n) * 43758.5453123) % 1; }
      function noise2(x, y, t) {
        const n = x * 127.1 + y * 311.7 + t * 74.7;
        return hash(n);
      }
      function smoothstep(t) { return t * t * (3 - 2 * t); }

      // 粒子：每个都有 anchor（家）
      const particles = [];
      function rand(a, b) { return a + Math.random() * (b - a); }

      function initParticles() {
        particles.length = 0;
        const c = getHeroCenter();

        for (let i = 0; i < N; i++) {
          // 环形分布 + 轻微散开（接近截图那种“环”）
          const ang = rand(0, Math.PI * 2);
          const ringJitter = rand(-90, 90);
          const r = RING_RADIUS + ringJitter;

          // 椭圆一点更像网页布局
          const ex = 1.15, ey = 0.88;

          const ax = c.x + Math.cos(ang) * r * ex;
          const ay = c.y + Math.sin(ang) * r * ey;

          // 初始位置稍微偏离 anchor，让它有“在呼吸”
          const px = ax + rand(-18, 18);
          const py = ay + rand(-18, 18);

          const col = palette[Math.floor(Math.random() * palette.length)];
          const size = rand(1.2, 2.6);  // 点大小
          const alpha = rand(0.55, 0.90);

          particles.push({
            ax, ay, x: px, y: py,
            vx: 0, vy: 0,
            size, alpha,
            rgb: col,
            seed: Math.random() * 1000
          });
        }
      }
      initParticles();

      // 每帧：如果标题中心变化（响应式），让 anchor 慢慢跟随
      function updateAnchors() {
        const c = getHeroCenter();
        // 如果你想更严谨：用 DOM getBoundingClientRect() 来取标题盒子中心
        // 这里做简单的“整体偏移修正”：
        // 不重新随机分布，只在整体中心变化时，给所有 anchor 加偏移（保持环形）
        // 为简化，这里不做复杂重排。你窗口尺寸变化时已 resize，不太影响视觉。
      }

      let t = 0;
      function tick() {
        t += 0.016;

        // smooth mouse
        mouse.x += (mouse.tx - mouse.x) * 0.12;
        mouse.y += (mouse.ty - mouse.y) * 0.12;

        // influence fade in/out（出触发很关键）
        const targetPower = mouse.inside ? 1 : 0;
        mouse.power += (targetPower - mouse.power) * 0.06;

        ctx.clearRect(0, 0, W, H);

        // 全局微呼吸：让环有“活的”感觉
        const breathe = 1 + Math.sin(t * 1.2) * BREATH * 0.06;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          // 回家弹簧（稳定器）
          let fx = (p.ax - p.x) * SPRING_K;
          let fy = (p.ay - p.y) * SPRING_K;

          // 鼠标力场：径向外凸 + 少量切向围绕
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const d = Math.hypot(dx, dy) || 1;

          const R = MOUSE_RADIUS * (0.85 + 0.25 * breathe);
          if (d < R && mouse.power > 0.001) {
            const ndx = dx / d;
            const ndy = dy / d;

            // falloff 平滑衰减（边缘不会硬）
            let tt = 1 - d / R;
            tt = smoothstep(tt);
            const s = tt * tt * MOUSE_PUSH * mouse.power;

            // 径向：外凸（想要凹进去就把符号反过来）
            fx += ndx * s;
            fy += ndy * s;

            // 切向：围绕（少量！）
            const tx = -ndy;
            const ty = ndx;
            fx += tx * s * ORBIT;
            fy += ty * s * ORBIT;
          }

          // 轻噪声：呼吸感（小就够了）
          const n = noise2(p.x * NOISE_SCALE, p.y * NOISE_SCALE, t * 0.25 + p.seed);
          const ang = n * Math.PI * 2;
          fx += Math.cos(ang) * NOISE * 0.06;
          fy += Math.sin(ang) * NOISE * 0.06;

          // integrate
          p.vx = (p.vx + fx) * DAMPING;
          p.vy = (p.vy + fy) * DAMPING;
          p.x += p.vx;
          p.y += p.vy;

          // draw
          const [r, g, b] = p.rgb;
          ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>

</html>
